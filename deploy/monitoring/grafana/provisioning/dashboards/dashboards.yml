apiVersion: 1

providers:
  - name: hangil
    orgId: 1
    folder: Hangil
    type: file
    disableDeletion: true
    # Dashboard là code trong repo — sửa trên UI sẽ bị ghi đè, đó là chủ ý.
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    # 4h — API chết mà chưa xử lý thì nhắc lại, nhưng không spam mỗi 5 phút
    repeat_interval: 4h
    routes:
      - receiver: telegram
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h

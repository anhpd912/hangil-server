# Loki single-binary, lưu filesystem — không cần S3/object store cho khối lượng log một API.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki log ở info khá ồn, chính nó lại là nguồn log — hạ xuống warn
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Chốt chặn RAM: flush chunk sớm hơn mặc định để không giữ nhiều dữ liệu trong bộ nhớ
ingester:
  chunk_idle_period: 5m
  chunk_target_size: 1048576
  max_chunk_age: 1h

querier:
  max_concurrent: 2

limits_config:
  retention_period: 168h        # 7 ngày, khớp Prometheus
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_streams_per_user: 2000
  max_query_series: 500
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

# Không có compactor bật retention thì retention_period ở trên vô nghĩa — log không bao giờ bị xoá.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

analytics:
  reporting_enabled: false

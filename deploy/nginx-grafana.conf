# Vhost cho Grafana. Chạy certbot --nginx -d grafana.hangil.io.vn sau khi enable file này;
# certbot tự thêm block listen 443 + redirect 80→443.
#
# Grafana bind 127.0.0.1:3000 nên không cần mở thêm port ufw.
server {
    listen 80;
    server_name grafana.hangil.io.vn;

    # Grafana tự upload/export dashboard JSON, mặc định 1m của Nginx là chật
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live tail của Loki và panel realtime dùng WebSocket — thiếu hai header này
        # thì log streaming đứng im mà không báo lỗi gì.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

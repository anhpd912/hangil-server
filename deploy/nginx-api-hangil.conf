server {
    listen 80;
    server_name api.hangil.io.vn;

    # Endpoint vận hành — chỉ dành cho Prometheus/healthcheck trong Docker network, không mở ra internet.
    # Prometheus scrape thẳng api:3201/metrics qua network hangil-net, không đi qua Nginx.
    location = /metrics {
        deny all;
    }

    # Readiness lộ trạng thái DB/Redis — chặn public, chỉ gọi được từ trong máy.
    location = /health/ready {
        allow 127.0.0.1;
        deny all;
    }

    # /health (liveness) để mở: smoke test sau deploy và uptime check từ ngoài cần gọi được.

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
